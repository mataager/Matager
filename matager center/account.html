<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.9.1/font/bootstrap-icons.min.css">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matager Admin Account</title>
    <link href="./matager.svg" rel="icon" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link
        href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500;600;700&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="./css/all.css">
    <link rel="stylesheet" href="./css/alll.css">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="./js/inithialize-firebase.js"></script>
</head>

<body id="top">

    <main>
        <div id="preloader" class="preloader hidden">
            <div class="spinner"></div>
        </div>
        <div class="formbold-form-wrapper" style="height: 1000px;">
            <div id="table-of-stores">
                <h5>Account</h5>
                <div class="mt-20">
                    <label class="formbold-form-label mt-20" for="username">User Name</label>
                    <input class="formbold-form-input" type="text" id="username" placeholder="username" readonly>

                    <label class="formbold-form-label mt-20" for="Email">Email</label>
                    <input class="formbold-form-input" type="text" id="Email" placeholder="Email" readonly>

                    <div class="flex center">
                        <button class="formbold-btn w-300" id="logout">Logout</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Wait for the DOM to load
        document.addEventListener('DOMContentLoaded', function () {
            const auth = firebase.auth(); // Firebase Authentication

            // Get the input elements
            const usernameInput = document.getElementById('username');
            const emailInput = document.getElementById('Email');
            const logoutButton = document.getElementById('logout');

            // Get authenticated user information
            auth.onAuthStateChanged(user => {
                if (user) {
                    // User is signed in, set the username and email fields
                    const displayName = user.displayName || 'No username set';
                    const email = user.email;

                    // Display the user info in the input fields
                    usernameInput.value = displayName;
                    emailInput.value = email;
                } else {
                    // If no user is signed in, redirect to the login page
                    window.location.href = './index.html'; // Adjust this to your login page
                }
            });

            // Logout functionality
            logoutButton.addEventListener('click', () => {
                auth.signOut()
                    .then(() => {
                        Swal.fire('Logged Out', 'You have been successfully logged out!', 'success');
                        // Redirect to login page after logout
                        window.location.href = './index.html'; // Adjust this to your login page
                    })
                    .catch((error) => {
                        console.error('Logout error: ', error);
                        Swal.fire('Error', 'Failed to log out!', 'error');
                    });
            });
        });
    </script>
</body>

</html>

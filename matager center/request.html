<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.9.1/font/bootstrap-icons.min.css">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matager Requests</title>
    <link href="./matager.svg" rel="icon" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link
        href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500;600;700&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="./css/all.css">
    <link rel="stylesheet" href="./css/alll.css">

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="./js/inithialize-firebase.js"></script>
</head>

<body id="top">

    <main>
        <div id="preloader" class="preloader hidden">
            <div class="spinner"></div>
        </div>
        <div class="formbold-form-wrapper" style="height: 1000px;">
            <div id="table-of-requests">
                <h5>All Requests</h5>
                <div class="search-bar flex center mb-20 mt-20">
                    <input type="text" id="Request-search-input" class="formbold-form-input w-300"
                        placeholder="Search by Phone Number">
                </div>
                <div class="table-wrapper mb-20 pt-16 overflow">
                    <table class="table">
                        <thead>
                            <tr>
                                <th scope="col">Name</th>
                                <th scope="col">Email</th>
                                <th scope="col">Phone</th>
                                <th scope="col">Plan</th>
                                <th scope="col">Store Name</th>
                                <th scope="col">Store Details</th>
                                <th scope="col" class="manage-col">Manage</th>
                            </tr>
                        </thead>
                        <tbody id="requests-table-body">
                            <!-- Rows will be inserted here -->
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </main>
    <!-- Modal HTML -->
    <div id="addUserModal" class="modal">
        <div class="modal-content">
            <span class="close-btn mb-20">&times;</span>
            <h2 class="mb-20">Add New Store</h2>
            <form id="addUserForm">
                <label class="formbold-form-label" for="domain">Domain-Name:</label>
                <input class="formbold-form-input" type="text" id="domain" name="domain" required>

                <label class="formbold-form-label" for="name">Name:</label>
                <input class="formbold-form-input" type="text" id="name" name="name" required>

                <label class="formbold-form-label" for="email">Email:</label>
                <input class="formbold-form-input" type="email" id="email" name="email" required>

                <label class="formbold-form-label" for="phone">Phone Number:</label>
                <input class="formbold-form-input" type="text" id="phone" name="phone" required>

                <label class="formbold-form-label" for="plan">Plan:</label>
                <input class="formbold-form-input" type="text" id="plan" name="plan" required>

                <label class="formbold-form-label" for="storeName">Store Name:</label>
                <input class="formbold-form-input" type="text" id="storeName" name="storeName" required>

                <label class="formbold-form-label" for="storeDetails">Store Details:</label>
                <textarea class="formbold-form-input" id="storeDetails" name="storeDetails" required></textarea>

                <button class="formbold-btn" type="submit">Add Store</button>
            </form>
        </div>
    </div>



    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const databaseRef = firebase.database().ref('/requests');
            const tableBody = document.getElementById('requests-table-body');
            const table = document.getElementById('table-of-requests');
            const preloader = document.querySelector('.preloader'); // Get the preloader element

            // Fetch data from Firebase Realtime Database
            databaseRef.once('value', (snapshot) => {
                const requests = snapshot.val();

                if (requests) {
                    // Convert requests object into an array of [id, request] pairs and reverse it
                    const reversedRequests = Object.entries(requests).reverse();

                    // Loop through the reversed array and append rows to the table
                    reversedRequests.forEach(([id, request]) => {
                        const row = document.createElement('tr');
                        row.setAttribute('id', id);
                        row.innerHTML = `
                <td>${request.name}</td>
                <td>${request.email}</td>
                <td>${request["phone"]}</td>
                <td>${request.plan}</td>
                <td>${request["store-name"]}</td>
                <td>${request["store-details"]}</td>
                <td class="flex">
                    <button type="button" request-id="${id}" class="formbold-form-label addbtn pointer open-order-btn p-7 add-btn">
                        <i class="bi bi-plus-circle"></i>
                    </button>
                    <button type="button" request-id="${id}" class="formbold-form-label addbtn pointer open-order-btn p-7 delete-btn">
                        <i class="bi bi-x-circle"></i>
                    </button>
                </td>
            `;
                        tableBody.appendChild(row);
                    });
                } else {
                    // Create a new row with the "No requests yet" message
                    const noRequestsRow = document.createElement('tr');
                    const noRequestsCell = document.createElement('td');

                    noRequestsCell.setAttribute('colspan', 1); // Adjust the colspan based on the number of columns
                    noRequestsCell.textContent = "No requests yet";
                    noRequestsCell.style.textAlign = 'center'; // Center the text

                    noRequestsRow.appendChild(noRequestsCell);
                    tableBody.appendChild(noRequestsRow);
                }
            });

            // Event listener for delete buttons
            tableBody.addEventListener('click', function (event) {
                if (event.target.closest('.delete-btn')) {
                    const button = event.target.closest('.delete-btn');
                    const requestId = button.getAttribute('request-id');

                    if (requestId) {
                        // Show confirmation dialog
                        Swal.fire({
                            title: 'Are you sure?',
                            text: "You won't be able to revert this!",
                            icon: 'warning',
                            showCancelButton: true,
                            confirmButtonColor: '#3085d6',
                            cancelButtonColor: '#d33',
                            confirmButtonText: 'Yes, delete it!',
                            cancelButtonText: 'Cancel'
                        }).then((result) => {
                            if (result.isConfirmed) {
                                // Show preloader
                                preloader.style.background = 'rgba(255, 255, 255, 0.7)'; // Light background to cover content
                                preloader.style.display = 'flex';

                                // Remove the request from Firebase
                                firebase.database().ref(`/requests/${requestId}`).remove()
                                    .then(() => {
                                        // Optionally, remove the row from the table
                                        const rowToRemove = document.getElementById(requestId);
                                        if (rowToRemove) {
                                            rowToRemove.remove();
                                        }
                                        // Show success alert using SweetAlert2
                                        Swal.fire({
                                            icon: 'success',
                                            title: 'Deleted!',
                                            text: 'Request deleted successfully!',
                                            showConfirmButton: false,
                                            timer: 1500  // Alert will auto-close after 1.5 seconds
                                        }).then(() => {
                                            // Hide preloader
                                            preloader.style.display = 'none';
                                        });
                                    })
                                    .catch((error) => {
                                        console.error('Error deleting request:', error);
                                        preloader.style.display = 'none'; // Hide preloader on error
                                    });
                            }
                        });
                    }
                }
            });

            // Event listener for add buttons
            tableBody.addEventListener('click', function (event) {
                if (event.target.closest('.add-btn')) {
                    const button = event.target.closest('.add-btn');
                    const requestId = button.getAttribute('request-id');

                    if (requestId) {
                        // Fetch the request data from Firebase
                        databaseRef.child(requestId).once('value', (snapshot) => {
                            const request = snapshot.val();

                            // Populate the modal form fields with request data
                            document.getElementById('name').value = request.name || '';
                            document.getElementById('email').value = request.email || '';
                            document.getElementById('phone').value = request["phone"] || '';
                            document.getElementById('plan').value = request.plan || '';
                            document.getElementById('storeName').value = request["store-name"] || '';
                            document.getElementById('storeDetails').value = request["store-details"] || '';
                            // Open the modal
                            document.getElementById('addUserModal').style.display = 'block';
                            document.getElementById('addUserForm').setAttribute('data-request-id', requestId); // Store requestId in the form
                        });
                    }
                }
            });

            // Close the modal when the user clicks on the close button
            document.querySelector('.close-btn').addEventListener('click', function () {
                document.getElementById('addUserModal').style.display = 'none';
            });

            // Handle form submission
            document.getElementById('addUserForm').addEventListener('submit', function (event) {
                event.preventDefault();

                //setup date
                // Define the formatting options with day first
                const options = {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: 'numeric',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: true // This will display the time in 12-hour format with AM/PM
                };

                // Get the current date and time with custom formatting
                const startingDate = new Date().toLocaleString('en-GB', options); // 'en-GB' for day/month/year format

                // Calculate the ending date by adding one month to the current date
                const endingDate = new Date();
                endingDate.setMonth(endingDate.getMonth() + 1); // Adds one month
                endingDate.setDate(endingDate.getDate() + 5); // Adds more 5 days for a free 

                // Format the ending date with the same custom options
                const endingDateString = endingDate.toLocaleString('en-GB', options);
                //

                // Show preloader
                preloader.style.background = 'rgba(255, 255, 255, 0.7)'; // Light background to cover content
                preloader.style.display = 'flex';

                // Get form values
                const domain = document.getElementById('domain').value;
                const name = document.getElementById('name').value;
                const email = document.getElementById('email').value;
                const phone = document.getElementById('phone').value;
                const plan = document.getElementById('plan').value;
                const storeName = document.getElementById('storeName').value;
                const storeDetails = document.getElementById('storeDetails').value;
                const requestId = document.getElementById('addUserForm').getAttribute('data-request-id'); // Get requestId from form

                // Create a new user in Firebase Authentication
                firebase.auth().createUserWithEmailAndPassword(email, email) // Use a placeholder password
                    .then((userCredential) => {
                        const user = userCredential.user;

                        // Update user's display name
                        user.updateProfile({ displayName: 'Store admin' });

                        // Add user details to 'Stores' node in Firebase Realtime Database
                        firebase.database().ref(`/Stores/${user.uid}`).set({
                            "Matager": {
                                "Amount": 0,
                                "count": 0,
                                "matager-cut": 0
                            }
                        }).then(() => {
                            // Remove the request from Firebase
                            databaseRef.child(requestId).remove()
                                .then(() => {
                                    // Save all information to 'store-info' node in Firebase Realtime Database
                                    firebase.database().ref(`/Stores/${user.uid}/store-info`).set({
                                        "Domain": domain,
                                        name: name,
                                        email: email,
                                        "phone-number": phone,
                                        plan: plan,
                                        "store-name": storeName,
                                        "store-details": storeDetails,
                                        "starting-date": startingDate,
                                        "ending-date": endingDateString
                                    }).then(() => {
                                        // Close the modal
                                        document.getElementById('addUserModal').style.display = 'none';

                                        // Optionally, you may want to update the table or refresh the data
                                        // Optionally, show success message
                                        Swal.fire({
                                            icon: 'success',
                                            title: 'Added!',
                                            text: 'User added successfully!',
                                            showConfirmButton: false,
                                            timer: 1500
                                        }).then(() => {
                                            // Hide preloader
                                            preloader.style.display = 'none';
                                        });
                                    }).catch((error) => {
                                        console.error('Error saving store info:', error);
                                        preloader.style.display = 'none'; // Hide preloader on error
                                    });
                                })
                                .catch((error) => {
                                    console.error('Error removing request:', error);
                                    preloader.style.display = 'none'; // Hide preloader on error
                                });
                        }).catch((error) => {
                            console.error('Error adding store to database:', error);
                            preloader.style.display = 'none'; // Hide preloader on error
                        });
                    })
                    .catch((error) => {
                        console.error('Error creating user:', error);
                        preloader.style.display = 'none'; // Hide preloader on error
                    });
            });
        });

    </script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function () {
            $('#Request-search-input').on('keyup', function () {
                var searchTerm = $(this).val().toLowerCase();
                $('#requests-table-body tr').each(function () {
                    var phoneNumber = $(this).find('td:nth-child(3)').text().toLowerCase();
                    if (phoneNumber.indexOf(searchTerm) !== -1) {
                        $(this).show();
                    } else {
                        $(this).hide();
                    }
                });
            });
        });
    </script>





</body>

</html>
